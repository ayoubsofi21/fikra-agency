    <script>
      // Apply saved theme + language before first paint (no FOUC / RTL flash)
      ;(function () {
        try {
          var root = document.documentElement

          var theme = localStorage.getItem('fikra-theme')
          try { theme = theme ? JSON.parse(theme) : null } catch (e) { /* raw legacy value */ }
          if (theme !== 'dark' && theme !== 'light') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          root.classList.toggle('dark', theme === 'dark')
          root.style.colorScheme = theme

          var lang = localStorage.getItem('fikra-language')
          try { lang = lang ? JSON.parse(lang) : null } catch (e) { /* raw legacy value */ }
          if (lang === 'fr' || lang === 'ar' || lang === 'en') {
            root.lang = lang
            root.dir = lang === 'ar' ? 'rtl' : 'ltr'
          }
        } catch (e) {
          /* storage unavailable */
        }
      })()
    </script>
